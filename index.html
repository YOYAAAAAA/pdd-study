// ==================== 状态管理 ====================
let currentLessonId = null;
let lessonDone = JSON.parse(localStorage.getItem('pdd_study_done') || '{}');
let quizAnswers = {}; // 当前课程的答题状态

// ==================== DOM 缓存 ====================
const $ = id => document.getElementById(id);
let _sidebarNav = null;
let _lessonContent = null;
let _mainContent = null;
let _welcomePage = null;
let _lessonPage = null;

function initDomCache() {
  _sidebarNav = $('modulesNav');
  _lessonContent = $('lessonContent');
  _mainContent = $('mainContent');
  _welcomePage = $('welcomePage');
  _lessonPage = $('lessonPage');
}

// ==================== 渲染左侧导航 ====================
function renderSidebar() {
  let html = '';
  
  moduleConfig.forEach(mod => {
    const modLessons = lessons.filter(l => l.module === mod.id);
    const doneCount = modLessons.filter(l => lessonDone[l.id]).length;
    const isOpen = mod.id === 1; // 默认展开第一个
    
    html += `
      <div class="module-group ${isOpen ? 'open' : ''}" data-module="${mod.id}">
        <div class="module-header" onclick="toggleModule(${mod.id})">
          <div class="module-icon" style="background: ${mod.color}20; color: ${mod.color};">${mod.icon}</div>
          <div class="module-title">
            ${mod.name}
            <div class="module-count">${doneCount}/${modLessons.length} 节</div>
          </div>
          <span class="module-arrow">▶</span>
        </div>
        <div class="module-lessons">
          ${modLessons.map(l => `
            <div class="lesson-item ${lessonDone[l.id] ? 'done' : ''} ${currentLessonId === l.id ? 'active' : ''}" 
                 onclick="openLesson('${l.id}')" data-lesson="${l.id}">
              <div class="lesson-check"></div>
              <span class="lesson-name">${l.title}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });
  
  _sidebarNav.innerHTML = html;
  updateSidebarProgress();
}

function toggleModule(modId) {
  const group = document.querySelector(`.module-group[data-module="${modId}"]`);
  group.classList.toggle('open');
}

function updateSidebarProgress() {
  const total = lessons.length;
  const done = Object.values(lessonDone).filter(Boolean).length;
  const percent = Math.round((done / total) * 100);
  
  document.getElementById('sideProgress').style.width = percent + '%';
  document.getElementById('sideProgressText').textContent = `${done}/${total}`;
}

// ==================== 打开课程 ====================
let _prevActiveLesson = null;

function openLesson(lessonId) {
  const info = _lessonIndex[lessonId];
  if (!info) return;
  const lesson = info.lesson;
  
  currentLessonId = lessonId;
  quizAnswers = {}; // 重置答题状态
  
  // 隐藏欢迎页，显示学习页
  _welcomePage.style.display = 'none';
  _lessonPage.style.display = 'block';
  
  // 更新面包屑
  $('crumbModule').textContent = lesson.moduleIcon + ' ' + lesson.moduleName;
  $('crumbLesson').textContent = lesson.title;
  
  // 更新标记完成按钮
  updateDoneButton();
  
  // 渲染内容
  renderLessonContent(lesson);
  
  // 更新左侧导航高亮（局部更新，不遍历全部）
  if (_prevActiveLesson) _prevActiveLesson.classList.remove('active');
  const activeItem = _sidebarNav.querySelector(`.lesson-item[data-lesson="${lessonId}"]`);
  if (activeItem) {
    activeItem.classList.add('active');
    _prevActiveLesson = activeItem;
  }
  
  // 滚动到顶部
  _mainContent.scrollTop = 0;
}

function updateDoneButton() {
  const done = lessonDone[currentLessonId];
  document.getElementById('doneIcon').textContent = done ? '↩️' : '✅';
  document.getElementById('doneText').textContent = done ? '取消完成' : '标记完成';
}

function toggleDone() {
  lessonDone[currentLessonId] = !lessonDone[currentLessonId];
  localStorage.setItem('pdd_study_done', JSON.stringify(lessonDone));
  updateDoneButton();
  
  // 局部更新侧边栏（不重建整个DOM）
  updateSidebarItemStatus(currentLessonId, lessonDone[currentLessonId]);
  updateSidebarModuleCount(lessons.find(l => l.id === currentLessonId).module);
  updateSidebarProgress();
  
  // 如果标记完成，显示完成卡片
  if (lessonDone[currentLessonId]) {
    showCompleteToast();
  }
}

// 局部更新单课完成状态
function updateSidebarItemStatus(lessonId, done) {
  const item = _sidebarNav.querySelector(`.lesson-item[data-lesson="${lessonId}"]`);
  if (item) {
    item.classList.toggle('done', done);
  }
}

// 局部更新模块进度计数
function updateSidebarModuleCount(modId) {
  const group = _sidebarNav.querySelector(`.module-group[data-module="${modId}"]`);
  if (!group) return;
  const modLessons = lessons.filter(l => l.module === modId);
  const doneCount = modLessons.filter(l => lessonDone[l.id]).length;
  const countEl = group.querySelector('.module-count');
  if (countEl) countEl.textContent = `${doneCount}/${modLessons.length} 节`;
}

function showCompleteToast() {
  // 简单提示
  const lesson = lessons.find(l => l.id === currentLessonId);
  const nextLesson = getNextLesson(currentLessonId);
  
  // 在自测题上方插入完成卡片
  const completeCard = document.createElement('div');
  completeCard.className = 'complete-card';
  completeCard.id = 'completeCard';
  completeCard.innerHTML = `
    <h3>🎉 太棒了！本课学习完成</h3>
    <p>${lesson.title} · 已加入你的学习成就</p>
    ${nextLesson ? `<button class="btn" onclick="openLesson('${nextLesson.id}')">下一课：${nextLesson.title} →</button>` : '<button class="btn">已完成全部课程 🏆</button>'}
  `;
  
  // 插入到自测题前面
  const quizSection = _lessonContent.querySelector('.quiz-section');
  if (quizSection) {
    _lessonContent.insertBefore(completeCard, quizSection);
  }
}

// ==================== 自测题逻辑 ====================
function selectOption(qIndex, oIndex) {
  const quizItem = document.querySelector(`.quiz-item[data-qindex="${qIndex}"]`);
  const options = quizItem.querySelectorAll('.quiz-option');
  
  // 如果已经提交了，不允许再选
  if (quizItem.classList.contains('submitted')) return;
  
  options.forEach(opt => opt.classList.remove('selected'));
  options[oIndex].classList.add('selected');
  
  quizAnswers[qIndex] = oIndex;
}

function submitQuiz() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  let score = 0;
  
  lesson.quiz.forEach((q, i) => {
    const quizItem = document.querySelector(`.quiz-item[data-qindex="${i}"]`);
    const options = quizItem.querySelectorAll('.quiz-option');
    const feedback = document.getElementById(`feedback-${i}`);
    const userAnswer = quizAnswers[i];
    
    quizItem.classList.add('submitted');
    
    if (userAnswer === undefined) {
      // 未作答
      feedback.className = 'quiz-feedback show wrong';
      feedback.innerHTML = `❌ 未作答。正确答案是 <strong>${String.fromCharCode(65 + q.answer)}</strong><br>${q.explain}`;
      return;
    }
    
    if (userAnswer === q.answer) {
      score++;
      options[userAnswer].classList.add('correct');
      feedback.className = 'quiz-feedback show correct';
      feedback.innerHTML = `✅ 回答正确！${q.explain}`;
    } else {
      options[userAnswer].classList.add('wrong');
      options[q.answer].classList.add('correct');
      feedback.className = 'quiz-feedback show wrong';
      feedback.innerHTML = `❌ 回答错误。正确答案是 <strong>${String.fromCharCode(65 + q.answer)}</strong><br>${q.explain}`;
    }
  });
  
  document.getElementById('quizScore').textContent = score;
}

function resetQuiz() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  quizAnswers = {};
  
  lesson.quiz.forEach((q, i) => {
    const quizItem = document.querySelector(`.quiz-item[data-qindex="${i}"]`);
    const options = quizItem.querySelectorAll('.quiz-option');
    const feedback = document.getElementById(`feedback-${i}`);
    
    quizItem.classList.remove('submitted');
    options.forEach(opt => {
      opt.classList.remove('selected', 'correct', 'wrong');
    });
    feedback.className = 'quiz-feedback';
    feedback.innerHTML = '';
  });
  
  document.getElementById('quizScore').textContent = '0';
}

// ==================== 导航辅助 ====================
let _lessonIndex = null;

function buildLessonIndex() {
  _lessonIndex = {};
  lessons.forEach((l, i) => {
    _lessonIndex[l.id] = { lesson: l, index: i };
  });
}

function getPrevLesson(lessonId) {
  const info = _lessonIndex[lessonId];
  if (!info || info.index === 0) return null;
  return lessons[info.index - 1];
}

function getNextLesson(lessonId) {
  const info = _lessonIndex[lessonId];
  if (!info || info.index >= lessons.length - 1) return null;
  return lessons[info.index + 1];
}

// ==================== 开始学习 ====================
function startLearning() {
  openLesson('1-1');
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', function() {
  buildLessonIndex();
  initDomCache();
  renderSidebar();
});
</script>
